server:
  port: 8085

spring:
  application:
    name: bitpub-edge
  datasource:
    url: jdbc:h2:file:./data/edge-db;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

bitpub:
  edge:
    locale-id: ${LOCALE_ID:locale-1}
  cloud:
    # Point directly to match-service (in Docker via container name, locally via localhost)
    match-service-url: ${CLOUD_MATCH_SERVICE_URL:http://localhost:8085}
  mqtt:
    local:
      broker-url: ${MQTT_LOCAL_BROKER_URL:tcp://localhost:1883}
      client-id: ${MQTT_LOCAL_CLIENT_ID:edge-node-1}
      topic-sensors: bitpub/sensors/#
