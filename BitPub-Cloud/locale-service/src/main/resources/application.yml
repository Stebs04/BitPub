server:
  port: 8083

spring:
  application:
    name: locale-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bitpub_locales
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

bitpub:
  jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    expirationMs: 86400000
  mqtt:
    cloud:
      broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
      client-id: ${MQTT_CLIENT_ID:locale-service-${random.uuid}}
      # Topic di base; i messaggi verranno inviati su bitpub/locales/games/{localeId}
      topic-games: bitpub/locales/games/+
      # Sottoscrittore per i comandi inoltrati dall'Edge (utilizzando QoS1 per l'affidabilita').
      inbound-client-id: ${MQTT_INBOUND_CLIENT_ID:locale-service-command-ingest}
      system-action-topic: bitpub/cloud/commands/system/locales/action
