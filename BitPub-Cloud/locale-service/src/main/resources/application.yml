server:
  port: 8083

spring:
  application:
    name: locale-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bitpub_locales
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

bitpub:
  jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    expirationMs: 86400000
  mqtt:
    cloud:
      broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
      client-id: ${MQTT_CLIENT_ID:locale-service-${random.uuid}}
      # Base topic; per-message topic is bitpub/locales/games/{localeId}
      topic-games: bitpub/locales/games/+
