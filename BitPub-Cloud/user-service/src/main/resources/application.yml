# Autore: Luca Franzon 20054744
#
# File di configurazione principale per il servizio utenti.
# Definisce le impostazioni del server, la connessione al database PostgreSQL, 
# la configurazione di Hibernate/JPA, la chiave segreta JWT e i parametri 
# per la comunicazione con il broker MQTT.
server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bitpub_users
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

bitpub:
  jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    expirationMs: 86400000
  mqtt:
    cloud:
      broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
      # Stable id + durable session so the broker queues Edge-forwarded commands while this service is down.
      inbound-client-id: ${MQTT_INBOUND_CLIENT_ID:user-service-command-ingest}
      system-action-topic: bitpub/cloud/commands/system/users/action
