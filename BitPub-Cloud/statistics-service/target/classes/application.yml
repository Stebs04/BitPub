server:
  port: 8087

spring:
  application:
    name: statistics-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bitpub_db}
    username: ${SPRING_DATASOURCE_USERNAME:bitpub}
    password: ${SPRING_DATASOURCE_PASSWORD:bitpub_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

bitpub:
  jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    expirationMs: 86400000

locale:
  service:
    url: ${LOCALE_SERVICE_URL:http://localhost:8083}

# Configurazione MQTT: gestisce la pubblicazione degli aggiornamenti in tempo reale per le classifiche (outbound)
# e la ricezione garantita e duratura dei risultati delle partite concluse (inbound ingest).
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:statistics-service-${random.uuid}}
  # L'utilizzo di un ID stabile e di una sessione duratura garantisce che il broker accodi i risultati dei match anche in caso di down temporaneo del servizio.
  inbound-client-id: ${MQTT_INBOUND_CLIENT_ID:statistics-service-result-ingest}
  topic:
    cloud-matches-result: bitpub/cloud/matches/result
