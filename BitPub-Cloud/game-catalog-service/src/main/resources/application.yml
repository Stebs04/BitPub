server:
  port: 8084

spring:
  application:
    name: game-catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bitpub_catalog
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:game-catalog-service-${random.uuid}}
  # Identificativo stabile accoppiato a una sessione persistente per garantire che il broker accodi i comandi in caso di disconnessione.
  inbound-client-id: ${MQTT_INBOUND_CLIENT_ID:game-catalog-service-command-ingest}
  topic:
    system-action: bitpub/cloud/commands/system/catalog/action

bitpub:
  jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    expirationMs: 86400000
