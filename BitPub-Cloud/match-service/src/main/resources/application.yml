# Configurazione di default per il servizio delle partite
server:
  port: 8085

spring:
  application:
    name: match-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bitpub_match
    username: bitpub
    password: password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Configurazione custom per l'integrazione MQTT
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:match-service-${random.uuid}}
  # Stable id + durable session so the broker queues Edge-forwarded events while this service is down.
  inbound-client-id: ${MQTT_INBOUND_CLIENT_ID:match-service-ingest}
  command-inbound-client-id: ${MQTT_COMMAND_INBOUND_CLIENT_ID:match-service-command-ingest}
  match-result-inbound-client-id: ${MQTT_MATCH_RESULT_INBOUND_CLIENT_ID:match-service-result-ingest}
  topic:
    cloud-sensors: bitpub/cloud/sensors/+/event
    cloud-commands: bitpub/cloud/commands/matches/+/action
    cloud-match-results: bitpub/cloud/commands/matches/+/result

# URL verso statistics-service per aggiornare la leaderboard a fine partita
statistics:
  service:
    url: ${STATISTICS_SERVICE_URL:http://localhost:8087}

user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

locale:
  service:
    url: ${LOCALE_SERVICE_URL:http://localhost:8083}
