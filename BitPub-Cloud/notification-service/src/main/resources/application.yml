# Configurazione per la porta di ascolto del web server integrato
server:
  port: 8088

spring:
  # Identificativo dell'applicazione all'interno dell'infrastruttura
  application:
    name: notification-service
    
  # Parametri di connessione al database relazionale contenente le entità di dominio
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bitpub_notifications
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    
  # Configurazioni relative al motore di persistenza e alla gestione dello schema dati
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Impostazioni specifiche per le logiche di dominio dell'ecosistema BitPub
bitpub:
  jwt:
    # Segreto utilizzato per firmare e validare i token di autenticazione degli utenti
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    # Tempo di validità in millisecondi prima della scadenza del token
    expirationMs: 86400000
