
services:
  # -----------------------
  # INFRASTRUCTURE
  # -----------------------
  postgres:
    image: postgres:16-alpine
    container_name: bitpub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - bitpub-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: bitpub-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - bitpub-backend
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 | grep -v Error || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # -----------------------
  # OBSERVABILITY
  # -----------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: bitpub-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - bitpub-monitoring
    depends_on:
      - discovery-server

  grafana:
    image: grafana/grafana:10.4.1
    container_name: bitpub-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - bitpub-monitoring
    depends_on:
      - prometheus

  # -----------------------
  # CORE SERVICES
  # -----------------------
  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    container_name: bitpub-discovery
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - bitpub-backend
      - bitpub-monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    container_name: bitpub-config
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI}
    networks:
      - bitpub-backend
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  api-gateway:
    build:
      context: .
      dockerfile: infra/api-gateway/Dockerfile
    container_name: bitpub-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI}
      - SPRING_CONFIG_IMPORT=configserver:${CONFIG_SERVER_URI}
    networks:
      - bitpub-frontend
      - bitpub-backend
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: bitpub-auth
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI}
      - SPRING_CONFIG_IMPORT=configserver:${CONFIG_SERVER_URI}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - bitpub-backend
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  game-service:
    build:
      context: .
      dockerfile: services/game-service/Dockerfile
    container_name: bitpub-game
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI}
      - SPRING_CONFIG_IMPORT=configserver:${CONFIG_SERVER_URI}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - bitpub-backend
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  tournament-service:
    build:
      context: .
      dockerfile: services/tournament-service/Dockerfile
    container_name: bitpub-tournament
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI}
      - SPRING_CONFIG_IMPORT=configserver:${CONFIG_SERVER_URI}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - bitpub-backend
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  stats-service:
    build:
      context: .
      dockerfile: services/stats-service/Dockerfile
    container_name: bitpub-stats
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI}
      - SPRING_CONFIG_IMPORT=configserver:${CONFIG_SERVER_URI}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - bitpub-backend
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  edge-sync-service:
    build:
      context: .
      dockerfile: services/edge-sync-service/Dockerfile
    container_name: bitpub-edge-sync
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI}
      - SPRING_CONFIG_IMPORT=configserver:${CONFIG_SERVER_URI}
    networks:
      - bitpub-backend
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  grafana_data:

networks:
  bitpub-frontend:
    driver: bridge
  bitpub-backend:
    driver: bridge
  bitpub-monitoring:
    driver: bridge
