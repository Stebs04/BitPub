version: '3.8'

services:
  # -----------------------
  # INFRASTRUCTURE DATABASES & BROKERS
  # -----------------------
  postgres:
    image: postgres:16-alpine
    container_name: bitpub-postgres
    environment:
      POSTGRES_USER: bitpub_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: bitpub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - bitpub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitpub_admin -d bitpub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: bitpub-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - bitpub-network

  # -----------------------
  # OBSERVABILITY
  # -----------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: bitpub-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - bitpub-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: bitpub-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    networks:
      - bitpub-network

  # -----------------------
  # MICROSERVICES
  # -----------------------
  discovery-server:
    build:
      context: ./infra/discovery-server
    container_name: bitpub-discovery
    ports:
      - "8761:8761"
    networks:
      - bitpub-network

  api-gateway:
    build:
      context: ./infra/api-gateway
    container_name: bitpub-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
    networks:
      - bitpub-network

  auth-service:
    build:
      context: ./services/auth-service
    container_name: bitpub-auth
    ports:
      - "8081:8081"
    depends_on:
      - discovery-server
      - postgres
    networks:
      - bitpub-network

  game-service:
    build:
      context: ./services/game-service
    container_name: bitpub-game
    ports:
      - "8082:8082"
    depends_on:
      - discovery-server
      - postgres
    networks:
      - bitpub-network

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

networks:
  bitpub-network:
    driver: bridge
