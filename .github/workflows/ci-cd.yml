name: BitPub CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  JAVA_VERSION: '21'

jobs:
  build-and-test:
    name: Build, Test, and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -B clean verify --file pom.xml
        env:
          MAVEN_OPTS: "-Xmx2g"

      - name: Publish Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Publish JaCoCo Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/'
          retention-days: 7

      - name: Publish Checkstyle Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-results
          path: '**/target/checkstyle-result.xml'
          retention-days: 7

      - name: Publish SpotBugs Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-results
          path: '**/target/spotbugsXml.xml'
          retention-days: 7

      - name: Publish OWASP Dependency-Check Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.html'
          retention-days: 7

  docker-publish:
    name: Build and Publish Docker Images
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Images
        # Assuming you are using Spring Boot Buildpacks to generate images.
        # Alternatively, you can use docker build commands if you have Dockerfiles.
        run: |
          mvn spring-boot:build-image -Dspring-boot.build-image.publish=true -Dspring-boot.build-image.imageName=${{ secrets.DOCKER_USERNAME }}/bitpub-%a:latest
          
      # If using Docker Compose for building images:
      # run: |
      #   docker-compose -f docker-compose.prod.yml build
      #   docker-compose -f docker-compose.prod.yml push
