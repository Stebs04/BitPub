version: '3.8'

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  mosquitto:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  prometheus:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  discovery-server:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  config-server:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api-gateway:
    restart: always
    ports:
      - "80:8080" # Expose gateway on port 80 for production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  auth-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  game-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  tournament-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  stats-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  edge-sync-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
