version: '3.8'

services:
  # --- DATABASE CLOUD ---
  db:
    image: postgres:16
    container_name: bitpub-db-container
    environment:
      - POSTGRES_DB=bitpub_db
      - POSTGRES_USER=bitpub_user
      - POSTGRES_PASSWORD=bitpub2026
    ports:
      - "5432:5432"
    volumes:
      - bitpub_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # --- BROKER MQTT (MOSQUITTO) ---
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: bitpub-broker
    ports:
      - "1883:1883"   # Porta standard (locale)
      - "8883:8883"   # Porta TLS sicura (cloud)
    volumes:
      # Mappatura della configurazione
      - ./BitPub-Cloud/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Mappatura dei certificati generati con OpenSSL
      - ./BitPub-Security/certs:/etc/mosquitto/certs:ro
      # Persistenza dati e log
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    depends_on:
      - db

volumes:
  bitpub_db_data:
  mosquitto_data:
  mosquitto_log: