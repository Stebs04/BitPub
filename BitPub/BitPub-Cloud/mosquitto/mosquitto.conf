# =================================================================
# Configurazione Mosquitto - Progetto BitPub
# =================================================================

# =================================================================
# ARCHITECTURAL FIX: Abilitiamo il partizionamento della sicurezza.
# Senza questa direttiva, le regole di autenticazione (es. anonimato)
# vengono unificate globalmente prendendo l'ultima impostazione letta.
# =================================================================
per_listener_settings true

# ------------------------------------------------------------------
# LISTENER 1: Porta locale 1883 (NO TLS)
# ------------------------------------------------------------------
listener 1883 0.0.0.0
allow_anonymous true

# ------------------------------------------------------------------
# LISTENER 2: Porta sicura 8883 (MQTTS / mTLS)
# ------------------------------------------------------------------
listener 8883 0.0.0.0
allow_anonymous false

# Certificati generati con OpenSSL
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key

# Obblighiamo il Mutual TLS: il client deve presentare un certificato
# firmato dalla nostra CA aziendale
require_certificate true

# In Mosquitto 2.x, anche con mTLS, allow_anonymous false richiede un username.
# Questo parametro usa il CN del certificato client come username MQTT,
# permettendo la connessione senza dover fornire username/password testuali.
use_identity_as_username true

# Protocollo minimo accettato
tls_version tlsv1.2

log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true