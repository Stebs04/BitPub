# Configurazione server Nginx per il frontend
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: client-side routes (/login, /play, ...) return index.html, not 404.
        try_files $uri $uri/ /index.html;
    }
}
