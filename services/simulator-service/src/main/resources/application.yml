server:
  port: 8095

spring:
  application:
    name: simulator-service


bitpub:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: simulator-service-client
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.web: DEBUG

# ─────────────────────────────────────────────────────────────────
# OpenAPI / Swagger UI  →  http://localhost:8082/swagger-ui.html
#                          http://localhost:8082/v3/api-docs
# ─────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    filter: true
  show-actuator: false
  packages-to-scan: com.bitpub.game.controller
