server:
  port: 8084

spring:
  application:
    name: stats-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bitpub_db
    username: bitpub_admin
    password: secret_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: stats
  flyway:
    enabled: true
    schemas: stats
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
