server:
  port: 8084

spring:
  application:
    name: stats-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bitpub_db
    username: bitpub_admin
    password: secret_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: stats
  flyway:
    enabled: true
    schemas: stats
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ─────────────────────────────────────────────────────────────────
# OpenAPI / Swagger UI  →  http://localhost:8084/swagger-ui.html
#                          http://localhost:8084/v3/api-docs
# ─────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    filter: true
  show-actuator: false
  packages-to-scan: com.bitpub.stats.controller
