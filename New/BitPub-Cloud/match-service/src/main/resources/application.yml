server:
  port: 8085

spring:
  application:
    name: match-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bitpub_match
    username: bitpub
    password: password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Configurazione custom per l'integrazione MQTT
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:match-service-${random.uuid}}
  topic:
    sensors: bitpub/sensors/#

# URL verso statistics-service per aggiornare la leaderboard a fine partita
statistics:
  service:
    url: ${STATISTICS_SERVICE_URL:http://localhost:8087}
