server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: game-service
          uri: lb://game-service
          predicates:
            - Path=/api/v1/games/**, /api/v1/locales/**, /api/v1/devices/**, /api/v1/sessions/**
          filters:
            - AuthenticationFilter
        - id: tournament-service
          uri: lb://tournament-service
          predicates:
            - Path=/api/v1/tournaments/**
          filters:
            - AuthenticationFilter
        - id: stats-service
          uri: lb://stats-service
          predicates:
            - Path=/api/v1/stats/**
          filters:
            - AuthenticationFilter
        - id: simulator-service
          uri: lb://simulator-service
          predicates:
            - Path=/api/v1/simulators/**
          filters:
            - AuthenticationFilter

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
