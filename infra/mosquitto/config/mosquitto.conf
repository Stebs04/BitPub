# =================================================================
# Configurazione Mosquitto - Progetto BitPub (Infrastruttura Docker)
# =================================================================

# Partizionamento della sicurezza per listener separati
per_listener_settings true

# ------------------------------------------------------------------
# LISTENER 1: Porta 1883 (NO TLS) - per health check e uso interno
# ------------------------------------------------------------------
listener 1883 0.0.0.0
allow_anonymous true

# ------------------------------------------------------------------
# LISTENER 2: Porta sicura 8883 (MQTTS / mTLS)
# Certificati montati da BitPub-Security/certs via docker-compose
# ------------------------------------------------------------------
listener 8883 0.0.0.0
allow_anonymous false

# Certificati generati con OpenSSL (generati da genera_certificati.ps1 / genera_broker_bitpub.sh)
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key

# Mutual TLS: il client deve presentare un certificato firmato dalla nostra CA
require_certificate true

# In Mosquitto 2.x, con mTLS, il CN del certificato client viene usato come username
use_identity_as_username true

# Protocollo minimo accettato
tls_version tlsv1.2

# ------------------------------------------------------------------
# PERSISTENZA E LOGGING
# ------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
connection_messages true
log_timestamp true
