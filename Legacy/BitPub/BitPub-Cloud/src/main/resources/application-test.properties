# ==========================================
# CONFIGURAZIONE DATABASE H2 (IN-MEMORY)
# ==========================================
# Creiamo un DB temporaneo in memoria compatibile con PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creerà e distruggerà le tabelle a ogni test automaticamente
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disabilitiamo Flyway nei test per evitare conflitti con la sintassi nativa PostgreSQL degli script SQL
spring.flyway.enabled=false

# ==========================================
# CONFIGURAZIONE SICUREZZA
# ==========================================
jwt.secret=UnaChiaveSegretaMoltoLungaPerGarantireSicurezzaTest2026!
jwt.expiration=86400000

# ==========================================
# CONFIGURAZIONE MQTT TLS (mTLS) TEST
# ==========================================
# Percorsi fittizi per far avviare il contesto Spring durante i test senza cercare certificati reali
mqtt.tls.ca-path=dummy/path/ca.crt
mqtt.tls.client-crt-path=dummy/path/client.crt
mqtt.tls.client-key-path=dummy/path/client.key
mqtt.tls.keystore-password=dummy_password